name: probe
description: >-
  TEMPORARY. Verifies that Dependabot's "**/*" directories glob actually reaches
  a composite action.yml in a subdirectory. Delete once answered — see #8.

# Why this exists
#
# Every third-party action in this repo is SHA-pinned, and Dependabot is what
# stops those pins rotting. But Dependabot's default configuration scans only
# .github/workflows and the root action.yml: a pin inside a composite action is
# not updated (dependabot-core#6704, open). The "**/*" glob is meant to cover
# that, but GitHub documents only the single "*" wildcard for this ecosystem and
# gives no nested example, so the behaviour is unverified.
#
# That matters because the same gap would silently freeze the
# aws-actions/configure-aws-credentials pin inside aws-auth (#1).
#
# The pin below is deliberately three majors out of date. If Dependabot opens a
# PR for it, the glob works and real actions can rely on it. If nothing arrives
# within a weekly cycle, each action directory must be listed explicitly in
# .github/dependabot.yml instead.
#
# This action is intentionally absent from release-please-config.json, so it is
# never versioned or published.

runs:
  using: composite
  steps:
    - uses: actions/checkout@a12a3943b4bdde767164f792f33f40b04645d846 # v3.0.0
