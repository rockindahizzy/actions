# Mirrors the consuming repositories (articulate-llm, articulate-llm-web).
nodeLinker: node-modules

# Yarn 4 defaults this to true, which puts the cache in ~/.yarn/berry/cache.
# Turning it off keeps the cache inside the project, so the self-test can
# assert the action resolved a project-local path rather than a hardcoded one.
enableGlobalCache: false
