name: ci

# Repo-invariant checks. These guard rules from ADR 0001 that are otherwise
# only conventions — the kind that hold until someone who has not read the ADR
# opens a PR.

on:
  pull_request:
    # `edited` matters: without it, fixing a bad PR title produces no new run
    # and the failing check sits there forever. Re-running does not help — a
    # re-run replays the original event payload, title included.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions: {}

jobs:
  conventional-pr-title:
    # Versions come from commit messages, and merges are squashed, so the PR
    # title becomes the commit message. A malformed title means a release
    # silently does not happen — no error, no signal.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR title is a conventional commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Read the title from the API, not github.event.pull_request.title.
          # The event payload is frozen at trigger time, so a re-run replays the
          # old title and can never pass once it has failed.
          title=$(gh api "repos/${REPO}/pulls/${PR}" --jq '.title')

          pattern='^(feat|fix|perf|docs|style|refactor|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+'
          if ! grep -Eq "$pattern" <<<"$title"; then
            echo "::error::PR title is not a conventional commit: '$title'"
            echo "Merges are squashed, so this title becomes the commit message"
            echo "release-please reads. A malformed title means no release, silently."
            echo ""
            echo "Expected e.g.  feat(aws-auth): add region input"
            echo "               fix(setup-node-yarn): honour packageManager"
            echo "               feat(aws-auth)!: drop the region input"
            echo "               chore: tidy the README"
            exit 1
          fi
          echo "OK: $title"

  repo-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: No bare tag may share a name with an action
        # Git cannot hold both a tag `aws-auth` and tags under `aws-auth/`, so a
        # bare tag would make every future aws-auth/vN impossible.
        run: |
          set -euo pipefail
          status=0
          while read -r pkg; do
            [ -n "$pkg" ] || continue
            if git rev-parse -q --verify "refs/tags/${pkg}" >/dev/null; then
              echo "::error::tag '${pkg}' collides with the action of the same name; no aws-auth/vN tag can exist alongside it"
              status=1
            fi
          done < <(jq -r '.packages | keys[]' release-please-config.json)
          exit $status

      - name: Composite actions must only use contexts they actually have
        # GitHub parses action.yml with its template engine before any shell
        # runs. An expression naming a context that does not exist inside a
        # composite action — vars, secrets, needs, matrix, job — fails
        # validation and the action does not load AT ALL, and an empty
        # expression fails the same way. The file stays perfectly valid YAML
        # throughout, so nothing else here catches it. Backslash-escaping does
        # not help: the engine runs before bash.
        #
        # Scan the PARSED document, not the raw text. A YAML comment is stripped
        # before the engine sees it and is therefore harmless, while the same
        # text inside a `run:` block scalar is content and is evaluated. A
        # raw-text scan cannot tell those apart and reports false positives on
        # comments that merely discuss expression syntax.
        run: |
          set -euo pipefail
          files=$(git ls-files '*/action.yml' '*/action.yaml')
          [ -n "$files" ] || { echo "OK — no composite actions yet"; exit 0; }

          status=0
          for f in $files; do
            while IFS= read -r finding; do
              echo "::error file=${f}::${finding}"
              status=1
            done < <(
              ruby -ryaml -e '
                allowed = %w[inputs steps github runner env]
                doc = YAML.safe_load(File.read(ARGV[0]), aliases: true)
                walk = lambda do |node, path|
                  case node
                  when Hash  then node.each { |k, v| walk.call(v, "#{path}.#{k}") }
                  when Array then node.each_with_index { |v, i| walk.call(v, "#{path}[#{i}]") }
                  when String
                    node.scan(/\$\{\{(.*?)\}\}/) do |m|
                      expr = m[0].strip
                      if expr.empty?
                        puts "#{path}: empty expression — the action will not load"
                      else
                        ctx = expr[/\A([a-zA-Z_]+)/, 1]
                        unless allowed.include?(ctx)
                          puts "#{path}: context \"#{ctx}\" does not exist in a composite action"
                        end
                      end
                    end
                  end
                end
                walk.call(doc, "")
              ' "$f"
            )
          done
          [ "$status" -eq 0 ] && echo "OK"
          exit $status

      - name: Composite actions must not use ./
        # Inside a composite action, ./ resolves against the *consumer's*
        # checkout, not this repository. $/ is the only correct form.
        run: |
          set -euo pipefail

          # Check grep's own exit status, not xargs'. Piping into `xargs -r`
          # reports success when the file list is empty — xargs exits 0 without
          # ever running grep — which an `if` reads as "matches found".
          hits=$(git ls-files '*/action.yml' '*/action.yaml' \
                 | xargs -r grep -nE '^\s*-?\s*uses:\s*\./' || true)

          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::composite actions must reference siblings with \$/, never ./"
            exit 1
          fi
          echo "OK"

      - name: Third-party actions must be SHA-pinned
        run: |
          set -euo pipefail
          status=0
          while read -r file; do
            # A pinned ref is 40 hex chars. $/ and ./ are local, not third-party.
            while read -r line; do
              ref="${line##*@}"
              case "$line" in *'uses:'*'$/'*|*'uses:'*'./'*) continue ;; esac
              if ! grep -Eq '^[0-9a-f]{40}$' <<<"${ref%% *}"; then
                echo "::error file=${file}::not SHA-pinned: ${line#* }"
                status=1
              fi
            done < <(grep -hoE 'uses:\s*[^ ]+@[^ ]+' "$file" || true)
          done < <(git ls-files '*.yml' '*.yaml' | grep -E '(action\.ya?ml|\.github/workflows/)')
          exit $status

      - name: Release workflow must not reference this repository
        # A broken action would otherwise block the release that fixes it.
        run: |
          set -euo pipefail
          if grep -nE 'uses:\s*(\$/|\./|rockindahizzy/actions)' .github/workflows/release.yml; then
            echo "::error::release.yml must not reference an action from this repository"
            exit 1
          fi
          echo "OK"
